<h2 mat-dialog-title style="margin-left: 20px">Удаление юзера {{this.data.name}}</h2>
<mat-dialog-content>
  <p>Вы действительно хотите удалить?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Нет</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Да</button>
</mat-dialog-actions>
