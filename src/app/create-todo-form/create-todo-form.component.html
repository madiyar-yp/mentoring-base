<h1>CREATE TODO FORM</h1>
<div class="form-wrapper">
    <form [formGroup]="formTodo" class="form">
        <mat-form-field class="form-input">
            <mat-label>Название задачи</mat-label>
            <input matInput formControlName="title">
            <mat-error>Текст задачи введено неправильно</mat-error>
        </mat-form-field>
        <mat-form-field class="form-input">
            <mat-label>Автор задачи</mat-label>
            <input matInput formControlName="userId">
            <mat-error>Автор введен неправильно</mat-error>
        </mat-form-field>
        <mat-form-field class="form-input">
            <mat-label>Задача завершена?</mat-label>
            <input matInput formControlName="completed">
            <mat-error>Ответ некорректен</mat-error>
        </mat-form-field>
        <button mat-raised-button (click)="submitForm()" [disabled]="formTodo.invalid" class="form-btn">Add Todo</button>
    </form>
</div>
