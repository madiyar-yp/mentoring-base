<h1>CREATE USER FORM</h1>
<div class="form-wrapper">
    <form [formGroup]="formUser" class="form" (ngSubmit)="submitForm()">
        <mat-form-field class="form-input">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name">
            <mat-error *ngIf="formUser.controls['name'].invalid && (formUser.controls['name'].dirty || formUser.controls['name'].touched)">
                Имя введено неправильно
            </mat-error>
        </mat-form-field>
        <mat-form-field class="form-input">
            <mat-label>Email</mat-label>
            <input type="email" matInput formControlName="email">
            <mat-error *ngIf="formUser.controls['email'].invalid && (formUser.controls['email'].dirty || formUser.controls['email'].touched)">
                Почта введено неправильно
            </mat-error>
        </mat-form-field>
        <mat-form-field class="form-input">
            <mat-label>Website</mat-label>
            <input matInput formControlName="website">
            <mat-error *ngIf="formUser.controls['website'].invalid && (formUser.controls['website'].dirty || formUser.controls['website'].touched)">
                Сайт введен неправильно
            </mat-error>
        </mat-form-field>
        <mat-form-field class="form-input">
            <mat-label>Company name</mat-label>
            <input matInput formControlName="companyName">
            <mat-error *ngIf="formUser.controls['companyName'].invalid && (formUser.controls['companyName'].dirty || formUser.controls['companyName'].touched)">
                Имя компании введено неправильно
            </mat-error>
        </mat-form-field>
        <button mat-raised-button [disabled]="formUser.invalid">Add User</button>
    </form>
</div>
